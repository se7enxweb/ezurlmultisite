#?ini charset="utf-8"?

# ezurlmultisite extension configuration

[MultisiteSettings]
# The siteaccesses that take part in cross-site linking, in order of
# preference (the first one wins when two serve the same subtree, after the
# current siteaccess and one in the current locale). A link made on a
# siteaccess that is not listed is left as the kernel makes it, and content
# is never sent to a siteaccess that is not listed.
# Empty: every siteaccess of AvailableSiteAccessList with
# RequireUserLogin=false and a PathPrefix (or a RootNodeList entry).
# Administration siteaccesses are never meant to be listed.
SiteAccessList[]
#SiteAccessList[]=site
#SiteAccessList[]=bold

# The root node of the subtree each siteaccess serves. A node belongs to the
# siteaccess whose root node is the deepest on its path. Without an entry:
# content.ini [NodeSettings] RootNode of that siteaccess when it is above 2,
# else the node of its IndexPage (content/view/full/<id>).
# The node ids differ between installations; the installer writes them.
RootNodeList[]
#RootNodeList[site]=89
#RootNodeList[bold]=73

# A path that starts with no PathPrefix is left alone. enabled: look it up
# as a URL alias (one query per link) and use the root node of its node.
ResolveUnprefixedPaths=disabled

[OperatorSettings]
# Force all ezurl output to be absolute URLs by default
ForceAbsoluteURL=disabled

# Default link type when class-based link generation is used
DefaultLinkType=internal

# Default quote style for ezurl: double | single | no
DefaultQuote=double

# Default server URL mode for ezurl: relative | full
DefaultServerURL=relative

# Enable role-based siteaccess override (requires [RoleMap] RoleList)
RoleOverride=disabled

# List of class identifiers that should use class-based link generation
SiteLinkClassList[]
#SiteLinkClassList[]=link
#SiteLinkClassList[]=file
#SiteLinkClassList[]=image
#SiteLinkClassList[]=banner

# Siteaccesses in priority order for language-based fallback
PrioritizedSiteaccessList[]

[HostMap]
# Override site.ini SiteURL per siteaccess when more than one hostname matches
#SiteAccess[siteaccess_name]=hostname

[PathMap]
# Convention-based path to siteaccess override, checked before PathPrefix detection.
#Path[path]=siteaccess_name

[RoleMap]
# Determine target siteaccess based on user role
#RoleList[role_id]=siteaccess_name

[PathSettings]
# If enabled, return empty string for these node/object IDs
DisableNodeID=disabled
DisableObjectID=disabled

#NodeIDList[]
#ObjectIDList[]

[DataTypeSettings]
# Map attribute datatypes to handler classes
HandlerList[ezurl]=eZURLMultisiteURLHandler
HandlerList[ezstring]=eZURLMultisiteURLHandler
HandlerList[ezbinaryfile]=eZURLMultisiteBinaryFileHandler
HandlerList[ezobjectrelation]=eZURLMultisiteObjectRelationHandler

# Generic class settings. Override per class identifier in a dedicated block.
[ClassSettings]
DefaultLinkType=internal
SelfLinking=enabled

# Per-class settings example (replace <class_identifier> with real class identifier)
#[<class_identifier>]
#DefaultLinkType=internal
#LinkTypeList[internal]=internal_link
#LinkTypeList[external]=external_link
#LinkTypeList[download]=file
#DataTypeClass=eZURLMultisiteURLHandler
#SelfLinking=disabled
